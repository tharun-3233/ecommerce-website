<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tharun's Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Sticky Navigation Bar -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">ShopEase</div>
            <nav class="nav-links">
                <a href="#" class="active">Home</a>
                <a href="#products">Products</a>
                <a href="#cart">Cart</a>
            </nav>
            <div class="nav-actions">
                <form class="search-bar" onsubmit="return false;">
                    <input id="search-input" type="text" placeholder="Search products..." aria-label="Search">
                    <button type="submit" aria-label="Search">
                        <span class="search-icon">🔍</span>
                    </button>
                </form>
                <div class="cart-icon" id="cart-icon">
                    <span class="cart-img">🛒</span>
                    <span class="cart-badge" id="cart-badge">0</span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <h1>Welcome to ShopEase</h1>
                <p>Your one-stop shop for the latest products. Enjoy seamless shopping and fast delivery!</p>
                <a href="#products" class="cta-btn">Shop Now</a>
            </div>
        </section>

        <!-- Product Grid Section -->
        <section class="products" id="products">
            <h2>Featured Products</h2>
            <div class="product-grid" id="product-grid">
                <!-- Product cards will be injected here by JS -->
            </div>
        </section>

        <section class="cart-section" id="cart">
            <h2>Your Cart</h2>
            <ul class="cart-items" id="cart-items"></ul>
            <div class="cart-total-row">
                <span>Total</span>
                <strong id="cart-total">$0.00</strong>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 ShopEase. All rights reserved.</p>
            <nav class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Contact</a>
            </nav>
        </div>
    </footer>

    <!-- Notification Modal -->
    <div id="notification" class="notification"></div>

    <script src="script.js"></script>
</body>
</html>
